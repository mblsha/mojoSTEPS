[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mojosteps"
version = "0.1.0"
description = "Runtime-configurable Mojo/MAX STEPS forecasts and multi-source regional adapters"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE", "NOTICE", "third_party/LICENSE.*", "third_party/pocketfft/LICENSE.md"]
authors = [{name = "Michael Pishchagin"}]
dependencies = ["numpy>=2.0", "scipy>=1.14"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Science/Research", "Topic :: Scientific/Engineering :: Atmospheric Science"]

[project.optional-dependencies]
research = ["numpy==2.5.1", "scipy==1.18.0", "pysteps==1.21.2", "dask==2026.8.0", "pytest>=8,<10", "build>=1.2"]
radar = ["netCDF4>=1.7", "pyproj>=3.6", "shapely>=2.0"]
demo = ["matplotlib>=3.9"]

[project.scripts]
mojosteps = "mojosteps.cli:main"

[project.urls]
Repository = "https://github.com/mblsha/mojoSTEPS"
Issues = "https://github.com/mblsha/mojoSTEPS/issues"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a locally built Apple Metal library and real GPU (opt in with MOJOSTEPS_TEST_GPU=1)"]
