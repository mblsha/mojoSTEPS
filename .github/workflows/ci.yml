name: CPU research checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      MPLCONFIGDIR: .build/mpl
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install OpenMP compiler for the pySTEPS reference
        if: runner.os == 'macOS'
        run: brew install llvm libomp
      - name: Install isolated pinned research and Mojo environments
        run: sh scripts/bootstrap.sh
      - name: Build native CPU core and probes
        run: .venv/bin/python scripts/build.py --backend cpu
      - name: Reference parity, RNG, FFT and API checks
        run: .venv/bin/python -m pytest -q
      - name: Synthetic demo
        run: .venv/bin/python -m mojosteps demo --compare --no-plot --output .build/ci-demo
      - name: Prove C caller matches Python boundary
        shell: bash
        run: |
          extra=()
          if [[ "$RUNNER_OS" == Linux ]]; then extra=(-ldl); suffix=so; else suffix=dylib; fi
          cc -O2 examples/forecast.c -o .build/forecast-c "${extra[@]}"
          .build/forecast-c "$PWD/.build/libmojosteps_cpu.$suffix" cpu .build/ci-demo/input.f64 .build/ci-demo/c-output.f64 4 3 1
          .venv/bin/python scripts/check_c_output.py .build/ci-demo
      - name: Multi-source regional demo and runtime C ABI
        run: |
          .venv/bin/python examples/multi_source.py --backend cpu --size 256 --kmperpixel 1 > .build/regional-demo.json
          .venv/bin/python scripts/check_runtime_c.py --backend cpu
      - name: Build and inspect source distributions
        run: |
          .venv/bin/python -m build --outdir .build/dist
          .venv/bin/python scripts/check_distribution.py .build/dist
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          include-hidden-files: true
          name: cpu-evidence-${{ matrix.os }}
          path: |
            .build/ci-demo/summary.json
            .build/*.manifest.json
            .build/regional-demo.json
